name: link-check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "catalogs/**"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "**.md"
      - "catalogs/**"
  schedule:
    # Weekly drift / link-rot scan (Mon 03:00 UTC).
    - cron: "0 3 * * 1"

jobs:
  lychee:
    name: lychee link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200,206,301,302,403
            --exclude-path "tests/"
            --exclude "https://example.com"
            "**/*.md"
            "catalogs/**/*.md"
            "catalogs/**/*.json"
          fail: true
          jobSummary: true
